[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-inference"
version = "0.1.0"
description = "Python AI Inference service for EL VERSE ECOSYSTEM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "openai>=1.14.0",
    "anthropic>=0.18.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9"
]

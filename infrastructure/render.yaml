services:
  - type: web
    name: elverse-api-gateway
    env: go
    buildCommand: go build -o bin/api-gateway ./apps/backend/api-gateway/cmd
    startCommand: ./bin/api-gateway
    envVars:
      - key: PORT
        value: 10000
      - key: GO_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: elverse-db
          property: connectionString
      - key: VALKEY_URL
        fromService:
          name: elverse-valkey
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: KORAPAY_SECRET_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

databases:
  - name: elverse-db
    plan: starter
    postgresMajorVersion: 15

services:
  - type: redis
    name: elverse-valkey
    plan: starter
    ipAllowList: []

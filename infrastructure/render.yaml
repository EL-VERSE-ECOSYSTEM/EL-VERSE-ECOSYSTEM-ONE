services:
  - type: web
    name: elverse-api-gateway
    env: go
    buildCommand: go build -o bin/api-gateway ./apps/backend/api-gateway/cmd
    startCommand: ./bin/api-gateway
    envVars:
      - key: PORT
        value: 10000
      - key: GO_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: VALKEY_URL
        fromService:
          name: elverse-valkey
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://kipafxeitjrlqtdhzhse.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: web
    name: elverse-messaging-service
    env: go
    buildCommand: go build -o bin/messaging-service ./apps/backend/messaging-service/cmd
    startCommand: ./bin/messaging-service
    envVars:
      - key: PORT
        value: 10005
      - key: GO_ENV
        value: production

  - type: web
    name: elverse-ai-inference
    env: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./apps/backend/ai-inference/Dockerfile
    dockerContext: ./apps/backend/ai-inference
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://kipafxeitjrlqtdhzhse.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: AI_INTERNAL_KEY
        generateValue: true

databases:
  - name: elverse-db
    plan: starter
    postgresMajorVersion: 15

services:
  - type: redis
    name: elverse-valkey
    plan: starter
    ipAllowList: []
